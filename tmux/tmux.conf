# prefix stays the default Ctrl+b

# nvim needs these: instant Esc, true color, focus events (autoread/gitsigns)
set -sg escape-time 10
set -g default-terminal "tmux-256color"
set -ag terminal-features ",*:RGB"
set -g focus-events on

# general
set -g mouse on
set -g history-limit 50000
set -g base-index 1           # windows start at 1, matching the keyboard
setw -g pane-base-index 1
set -g renumber-windows on
setw -g mode-keys vi          # vim keys in copy mode (prefix+[)

# splits: | side by side, - below, both open in the current directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# resize panes with prefix + H/J/K/L (repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind r source-file ~/.config/tmux/tmux.conf \; display "tmux config reloaded"

# vim-tmux-navigator: Ctrl+h/j/k/l moves across nvim splits and tmux panes alike
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?$'"
bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"
bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R
# Ctrl+l is taken above, so prefix + Ctrl+l clears the shell instead
bind C-l send-keys C-l

# copy mode: v selects, y copies to the system clipboard (pbcopy on macOS,
# wl-copy or xclip on Linux)
bind -T copy-mode-vi v send -X begin-selection
if-shell "uname | grep -q Darwin" \
  "bind -T copy-mode-vi y send -X copy-pipe-and-cancel pbcopy" \
  "bind -T copy-mode-vi y send -X copy-pipe-and-cancel 'wl-copy 2>/dev/null || xclip -in -selection clipboard'"
